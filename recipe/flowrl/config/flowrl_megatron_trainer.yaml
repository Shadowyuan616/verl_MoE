# FlowRL Megatron Trainer Configuration
# This config extends the standard megatron PPO trainer for FlowRL algorithm

hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_megatron_trainer
  - _self_

data:
  gen_batch_size: ${data.train_batch_size}

reward_model:
  reward_manager: dapo
  overlong_buffer:
    enable: False # We try to avoid forgetting to set enable
    len: 0
    penalty_factor: 0.0
    log: False

algorithm:
  # FlowRL specific settings
  filter_groups:
    _target_: verl.trainer.config.FilterGroupsConfig
    enable: False # We try to avoid forgetting to set enable
    metric: null # acc / score / seq_reward / seq_final_reward / ...
    max_num_gen_batches: 0 # Non-positive values mean no upper limit

actor_rollout_ref:
  actor:
    # FlowRL specific: number of layers in ProjZ module
    proj_layer: 3

    # PPO configuration (inherited, adjust as needed for FlowRL)
    ppo_epochs: 1
    ppo_mini_batch_size: 256
    ppo_micro_batch_size_per_gpu: 4

    # Megatron specific settings (inherited)
    megatron:
      use_distributed_optimizer: true

trainer:
  project_name: verl-flowrl-megatron

